<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skiff • Gestures playground</title>
<style>
:root{color-scheme:dark}body{font:16px system-ui,sans-serif;background:#10263a;color:#e6f7ff;margin:0;padding:2rem}main{max-width:960px;margin:auto}h1{margin-bottom:.15rem;font-size:1.65rem}p{color:#b5d0df;line-height:1.45}#stage{background:#edfaff;border-radius:18px;min-height:370px;display:grid;place-items:center}#stage svg{width:min(85%,480px);height:auto;image-rendering:pixelated}.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:1rem;margin-top:1.2rem}label{display:grid;gap:.4rem}select,button{font:inherit;padding:.55rem .75rem;border-radius:8px;border:1px solid #61829a;background:#173c59;color:white}button{cursor:pointer;background:#246ba0}button:hover{background:#327fb6}.toggle{display:flex;align-items:center;gap:.6rem;padding:.6rem}.toggle input{accent-color:#4fd4e5}#description{min-height:3.5em}small{color:#c3d9e7}
</style></head><body><main><h1>pose-animate · Skiff</h1><p>Expressive gestures preview · standalone, offline-capable SVG</p><div id="stage" aria-label="Skiff animated character"></div><div class="controls"><label>System state<select id="state"></select></label><label>Mood<select id="mood"></select></label><label>Gesture<select id="pose"></select></label><label>Palette<select id="palette"></select></label><label>Expression<select id="face"></select></label><label>Light pulse<select id="pulse"></select></label><label class="toggle"><input type="checkbox" id="motion" checked>Animate</label><button id="replay" type="button">Replay gesture</button></div><p id="description" aria-live="polite"></p><small>Each limb still contains six independent squares. Articulated motion samples at 12 steps/second. State and mood are separate. Reduced-motion system preferences are respected.</small></main>
<script type="module">
import {createSkiff,poses,palettes,skiffStates,skiffMoods} from '../dist/index.js';
const skiff=createSkiff(document.querySelector('#stage'),{reducedMotion:'auto'});
const descriptions={idle:'Idle: a quiet bob and subtle tentacle motion.',greet:'Greet: Skiff lifts an upper arm and gives a soft hello.',wave:'Wave: one upper arm swings back and forth in a recognizable wave.',listen:'Listen: a side arm extends and gently searches as Skiff concentrates.',ponder:'Ponder: a lower arm reaches toward the face and moves thoughtfully.',present:'Present: a side arm reaches outward as if pointing at something.',celebrate:'Celebrate: upper and lower arms bounce while Skiff hops with excitement.'};
function select(id,values,fn){const node=document.querySelector('#'+id);for(const value of values){const opt=document.createElement('option');opt.value=value;opt.textContent=value;node.append(opt);}node.addEventListener('change',()=>fn(node.value));}
select('state',['manual',...skiffStates],value=>{
  if(value==='manual'){const pose=document.querySelector('#pose').value;skiff.transitionTo(pose);document.querySelector('#description').textContent=descriptions[pose];}
  else{skiff.setState(value);document.querySelector('#description').textContent='System state: '+value+' (semantic pose, expression and light pulse).';}
});
select('mood',skiffMoods,value=>skiff.setMood(value));
select('pose',Object.keys(poses),value=>{skiff.transitionTo(value,{duration:420});document.querySelector('#state').value='manual';document.querySelector('#description').textContent=descriptions[value];});
select('palette',Object.keys(palettes),value=>skiff.setColor(value));
select('face',['default','open','happy','blink','concerned','focused','sleeping','surprised'],value=>skiff.setExpression(value==='default'?null:value));
select('pulse',['none','inward','outward'],value=>skiff.pulse(value));
document.querySelector('#motion').addEventListener('change',event=>skiff.setMotionEnabled(event.target.checked));
document.querySelector('#replay').addEventListener('click',()=>skiff.replay());
document.querySelector('#description').textContent=descriptions.idle;
</script></body></html>
