name: Standalone Skiff preview
on:
  push:
    branches: [unstable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/capture-visuals.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: skiff-standalone
          path: docs/index.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: skiff-visual-baselines
          path: visual-output/
          if-no-files-found: error
